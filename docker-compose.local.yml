# 仅供本机测试；端口只监听回环地址，不对局域网开放。
services:
  api:
    environment:
      LOGIN_CLIENT_IP_SOURCE: peer
      # 本机代理 Fake-IP 兼容；腾讯云不加载此配置。
      IMAGE_DOWNLOAD_ALLOW_FAKE_IP: "true"
    ports:
      - "127.0.0.1:8001:8000"

  result-worker:
    environment:
      IMAGE_DOWNLOAD_ALLOW_FAKE_IP: "true"

  web:
    ports:
      - "127.0.0.1:5173:80"

  admin-web:
    ports:
      - "127.0.0.1:5174:80"
