<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haitoro Hub 工作页</title><link rel="stylesheet" href="/assets/workbench.css"><script defer src="/assets/workbench.js"></script></head><body>
<header><div><span class="eyebrow">HAITORO</span><h1>Hubstudio 本地工作页</h1><p id="status">正在连接…</p></div><div class="header-actions"><button id="pause">暂停领取</button></div></header><main>
<section id="login-section" hidden><h2>登录 ERP 并授权当前电脑</h2><p>使用 ERP 邮箱和密码登录。授权完成后，这台电脑可执行该账号的任务；密码不会保存。</p><form id="login-form" method="post" action="/api/login"><label for="email">ERP 邮箱</label><input id="email" type="email" autocomplete="username" required maxlength="320"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required maxlength="4096"><button id="login-button" type="submit" disabled>登录并授权</button><p id="login-error" role="alert"></p></form></section>
<div id="error" role="alert"></div>
<section id="policy-panel"><div class="heading"><div><h2>上品策略</h2><p>每个模版配置允许环境及分配方式，未匹配的任务等待补齐策略。轮流按所选顺序执行。</p></div><button id="add-policy">新增策略</button></div><div class="scroll"><table id="policies"></table></div></section>
<dialog id="policy-dialog" aria-labelledby="policy-title"><div class="heading"><h2 id="policy-title">配置上品策略</h2><button id="close-policy">关闭</button></div><form id="policy-form"><label>产品模版<select id="policy-template" required></select></label><label>分配方式<select id="policy-mode"><option value="round_robin">轮流</option><option value="random">随机</option></select></label><fieldset class="policy-environment-field"><legend>允许环境（可多选）</legend><div id="policy-environments"></div></fieldset><p id="policy-order"></p><p id="policy-error" role="alert"></p><button id="save-policy" type="submit">保存策略</button></form></dialog><div class="workbench-layout"><section id="environment-panel"><div class="heading"><div><div class="environment-title"><h2>环境列表</h2><span id="environment-count" aria-live="polite" hidden>共 0 个环境</span></div><p>所有可访问环境均可加入上品策略；每个任务按模版策略分配到一家环境。</p></div><div class="environment-tools"><button id="sync">刷新环境</button></div></div><p id="sync-status"></p><div class="scroll"><div id="environment-refreshing" role="status" aria-live="polite">刷新中…</div><table id="environments" hidden aria-busy="true"></table></div></section>
<aside class="workbench-sidebar" aria-label="上品任务和运行日志"><section id="task-panel"><div class="heading"><div><h2>任务列表</h2><p>页面明确显示“导入成功”后，任务完成。</p></div><select id="filter" aria-label="任务状态"><option value="">全部状态</option><option value="queued">排队中</option><option value="running">执行中</option><option value="awaiting_attention">待人工处理</option><option value="completed">已完成</option><option value="failed">失败</option><option value="expired">文件已过期</option><option value="cancelled">已取消</option></select></div><div class="scroll"><table id="tasks"></table></div><div class="pagination"><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></div></section>

<section id="log-panel"><div class="heading"><h2>本机运行日志</h2><div class="log-tools"><button id="copy-logs">复制</button><button id="clear-logs">清除</button></div></div><p id="log-feedback" role="status" aria-live="polite"></p><pre id="logs" aria-label="本机运行日志内容"></pre></section></aside></div></main><dialog id="detail" aria-labelledby="detail-title"><div class="heading"><h2 id="detail-title"></h2><button id="close-detail">关闭</button></div><div id="detail-content"></div></dialog><footer>页面关闭后执行器仍继续工作。关闭执行器程序或终端窗口将停止执行。</footer></body></html>
