x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    logging: *default-logging
    environment:
      MYSQL_DATABASE: haitoro
      MYSQL_USER: haitoro
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 旧数据卷不会重新执行 MYSQL_USER/MYSQL_PASSWORD 初始化。此服务在每次
  # `docker compose up` 时幂等地校正本地应用账号，避免 API 因 1045 无法重启。
  db-init:
    image: mysql:8.4
    logging: *default-logging
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        case "$${MYSQL_PASSWORD}" in
          *[!0-9A-Fa-f]*|'') echo "MYSQL_PASSWORD 必须是十六进制随机字符串" >&2; exit 1 ;;
        esac
        if [ "$${#MYSQL_PASSWORD}" -lt 32 ]; then
          echo "MYSQL_PASSWORD 至少需要 32 个十六进制字符" >&2
          exit 1
        fi
        mysql -h mysql -uroot <<SQL
        CREATE DATABASE IF NOT EXISTS haitoro;
        CREATE USER IF NOT EXISTS 'haitoro'@'%' IDENTIFIED BY '$${MYSQL_PASSWORD}';
        ALTER USER 'haitoro'@'%' IDENTIFIED BY '$${MYSQL_PASSWORD}';
        GRANT ALL PRIVILEGES ON haitoro.* TO 'haitoro'@'%';
        FLUSH PRIVILEGES;
        SQL
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build: ./backend
    logging: *default-logging
    environment:
      DATABASE_URL: mysql+pymysql://haitoro:${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}@mysql:3306/haitoro
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中配置 SECRET_KEY}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-${SECRET_KEY:?请在 .env 中配置 SECRET_KEY}}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-4320}
      SUPER_ADMIN_ACCESS_TOKEN_MINUTES: ${SUPER_ADMIN_ACCESS_TOKEN_MINUTES:-480}
      # 每套部署只允许自己的运营端和管理端域名跨域访问。
      CORS_ORIGINS: ${CORS_ORIGINS:?请在 .env 中配置 CORS_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TIMEZONE: ${LOG_TIMEZONE:-Asia/Hong_Kong}
      # 模型平台密钥由公司管理员在成员管理中按员工配置。
      GRSAI_BASE_URL: ${GRSAI_BASE_URL:-https://grsaiapi.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_TITLE_MODEL: ${DEEPSEEK_TITLE_MODEL:-deepseek-v4-flash-vision-exp}
      # Cloudflare R2 S3 API 凭据仅通过部署环境注入，切勿提交到仓库。
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-haitoo-images-prod}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-https://img.haitoro.com}
      # false 时保留模型生成结果的临时 URL；生产环境建议保持 true。
      AI_GENERATED_IMAGE_UPLOAD_TO_R2: ${AI_GENERATED_IMAGE_UPLOAD_TO_R2:-true}
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # 独立、串行的版本化数据库迁移；API 和 Worker 不在启动时修改表结构。
  migrate:
    build: ./backend
    logging: *default-logging
    command: python -m app.db_migrate
    environment:
      DATABASE_URL: mysql+pymysql://haitoro:${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}@mysql:3306/haitoro
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中配置 SECRET_KEY}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-${SECRET_KEY:?请在 .env 中配置 SECRET_KEY}}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TIMEZONE: ${LOG_TIMEZONE:-Asia/Hong_Kong}
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  submit-worker:
    build: ./backend
    logging: *default-logging
    command: python -m app.task_worker submit
    environment:
      DATABASE_URL: mysql+pymysql://haitoro:${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}@mysql:3306/haitoro
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中配置 SECRET_KEY}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-${SECRET_KEY:?请在 .env 中配置 SECRET_KEY}}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TIMEZONE: ${LOG_TIMEZONE:-Asia/Hong_Kong}
      GRSAI_BASE_URL: ${GRSAI_BASE_URL:-https://grsaiapi.com}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-haitoo-images-prod}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-https://img.haitoro.com}
      AI_GENERATED_IMAGE_UPLOAD_TO_R2: ${AI_GENERATED_IMAGE_UPLOAD_TO_R2:-true}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  result-worker:
    build: ./backend
    logging: *default-logging
    command: python -m app.task_worker result
    environment:
      DATABASE_URL: mysql+pymysql://haitoro:${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}@mysql:3306/haitoro
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中配置 SECRET_KEY}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-${SECRET_KEY:?请在 .env 中配置 SECRET_KEY}}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TIMEZONE: ${LOG_TIMEZONE:-Asia/Hong_Kong}
      GRSAI_BASE_URL: ${GRSAI_BASE_URL:-https://grsaiapi.com}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-haitoo-images-prod}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-https://img.haitoro.com}
      AI_GENERATED_IMAGE_UPLOAD_TO_R2: ${AI_GENERATED_IMAGE_UPLOAD_TO_R2:-true}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # 公司级妙手公共采集箱同步；每 5 分钟运行一次，仅缓存外部采集商品。
  miaoshou-collect-box-worker:
    build: ./backend
    logging: *default-logging
    command: python -m app.task_worker miaoshou-collect-box
    environment:
      DATABASE_URL: mysql+pymysql://haitoro:${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}@mysql:3306/haitoro
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中配置 SECRET_KEY}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-${SECRET_KEY:?请在 .env 中配置 SECRET_KEY}}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TIMEZONE: ${LOG_TIMEZONE:-Asia/Hong_Kong}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Vite 在镜像构建阶段写入 API 地址，修改后需重新执行 --build。
        VITE_API_URL: ${VITE_API_URL:?请在 .env 中配置 VITE_API_URL}
    logging: *default-logging
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  admin-web:
    build:
      context: ./frontend-admin
      args:
        VITE_API_URL: ${VITE_API_URL:?请在 .env 中配置 VITE_API_URL}
    logging: *default-logging
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  # 本地 Cloudflare 部署入口；腾讯云部署不启用此 profile。
  tunnel:
    image: cloudflare/cloudflared:latest
    logging: *default-logging
    profiles: ["cloudflare"]
    # 未设置 token 时此 profile 启动会失败；不影响普通本地 docker compose up。
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - web
      - admin-web
      - api

volumes:
  mysql_data:
