services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: haitoo
      MYSQL_USER: haitoo
      MYSQL_PASSWORD: haitoo_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_dev_only"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://haitoo:haitoo_dev@mysql:3306/haitoo
      SECRET_KEY: change-me-before-production
      # 生产隧道启动时，在 .env 中设置为 https://erp.haitoro.com。
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      # 在部署环境中通过密钥管理服务或 CI 注入，勿提交真实密钥。
      SEEDREAM_API_KEY: ${SEEDREAM_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GRSAI_API_KEY: ${GRSAI_API_KEY:-}
      GRSAI_BASE_URL: ${GRSAI_BASE_URL:-https://grsaiapi.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_TITLE_MODEL: ${DEEPSEEK_TITLE_MODEL:-deepseek-v4-flash-vision-exp}
      # Cloudflare R2 S3 API 凭据仅通过部署环境注入，切勿提交到仓库。
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-haitoo-images-prod}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-https://img.haitoro.com}
      # false 时不复制 Seedream/千问生成结果到 R2；Gemini 的内嵌结果仍需上传 R2。
      AI_GENERATED_IMAGE_UPLOAD_TO_R2: ${AI_GENERATED_IMAGE_UPLOAD_TO_R2:-true}
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Vite 开发服务器启动时读取；公网时改为 https://api.haitoro.com。
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  admin-web:
    build: ./frontend-admin
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    volumes:
      - ./frontend-admin:/app
      - /app/node_modules
    depends_on:
      - api

  # 使用 Cloudflare Zero Trust 控制台创建 Tunnel 后，以 token 连接。
  # 仅在需要公网访问时启动：docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    # 未设置 token 时此 profile 启动会失败；不影响普通本地 docker compose up。
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - web
      - api

volumes:
  mysql_data:
