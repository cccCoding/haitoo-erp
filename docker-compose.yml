services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: haitoo
      MYSQL_USER: haitoo
      MYSQL_PASSWORD: haitoo_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_dev_only"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://haitoo:haitoo_dev@mysql:3306/haitoo
      SECRET_KEY: change-me-before-production
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      # 在部署环境中通过密钥管理服务或 CI 注入，勿提交真实密钥。
      SEEDREAM_API_KEY: ${SEEDREAM_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # 须是模型服务可访问的公网 HTTPS 域名，例如 https://pod.example.com
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-}
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  admin-web:
    build: ./frontend-admin
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: http://localhost:8001
    volumes:
      - ./frontend-admin:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  mysql_data:
